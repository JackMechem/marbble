name: Feature request
description: Something Marbble should do that it doesn't yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Marbble follows Logic Pro's workflow. The [feature scope board](https://github.com/users/JackMechem/projects/1) lists the Logic Pro features it doesn't have yet, and the [milestones](https://github.com/JackMechem/marbble/milestones) the order things are planned in.
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do in Marbble, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How other DAWs do it
      description: How Logic Pro or another DAW handles it, if you know.
    validations:
      required: false
