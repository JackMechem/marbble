name: Feature request
description: Something Marbble should do that it doesn't yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Marbble follows Logic Pro's workflow. The [feature list](https://github.com/JackMechem/marbble/blob/main/docs/FEATURES.md) shows which Logic Pro features it has and which it doesn't yet, and the [roadmap](https://github.com/JackMechem/marbble/blob/main/ROADMAP.md) what comes next.
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do in Marbble, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How other DAWs do it
      description: How Logic Pro or another DAW handles it, if you know.
    validations:
      required: false
