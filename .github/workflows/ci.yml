# Type-checks and tests the frontend and the engine, and checks that the app builds, on
# Linux, Windows and macOS for every push and pull request. On Linux and macOS it also runs the
# headless engine checks that need no third-party plug-ins.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Clippy and rustfmt run on this exact version, while the builds and tests float on stable, so
  # a lint added to a new Rust release can't turn CI red without a code change. Bump it on
  # purpose, in a commit that also fixes what the new version reports (docs/DEVELOPING.md).
  LINT_TOOLCHAIN: "1.99.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action defaults to -D warnings; warnings shouldn't fail the build.
          rustflags: ""

      - run: npm ci
      - name: Type-check and build the frontend
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Engine unit tests
        run: cargo test -p daw-engine --lib
      - name: App unit tests
        run: cargo test -p daw
      - name: Check everything compiles (examples included)
        run: cargo check --workspace --all-targets
      - name: Install the pinned lint toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Feature list is current
        if: runner.os == 'Linux'
        run: python3 scripts/features.py --check
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo "+$LINT_TOOLCHAIN" fmt --all --check
      - name: Clippy, warnings are errors
        if: runner.os == 'Linux'
        run: cargo "+$LINT_TOOLCHAIN" clippy --workspace --all-targets -- -D warnings
      # A real Session on ALSA's null output device (no sound card, audio server or plug-ins
      # needed), with a generated test tone; the same script developers run. macOS has no ALSA,
      # so there the engine runs on its silent stand-in device.
      - name: Headless engine checks
        if: runner.os != 'Windows'
        run: bash scripts/headless-checks.sh

  # The flake: `nix build` (and so `nix run`) builds the app and runs the engine's unit tests.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
