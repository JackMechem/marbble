[package]
name = "daw"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
daw-engine = { path = "../crates/engine" }
vst3-host = { path = "../crates/vst3-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gio = "0.18"
gdk = "0.18"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar's keys (src/menu/mac_keys.rs). The versions muda already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
block2 = "0.6"
