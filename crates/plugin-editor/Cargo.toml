[package]
name = "plugin-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSEvent"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSNotification"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
