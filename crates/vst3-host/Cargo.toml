[package]
name = "vst3-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plugin-api = { path = "../plugin-api" }
plugin-editor = { path = "../plugin-editor" }
vst3 = "0.3"
libloading = "0.9"
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
rtrb = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# The examples' own event loops and measurements.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSRunningApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDate", "NSRunLoop", "NSObjCRuntime", "NSString", "NSGeometry"] }
