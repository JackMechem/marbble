[[feature]]
section = "Plug-in windows and settings"
name = "Plug-in window header"
status = "partial"
tier = "pro"
logic = "568"
note = "Built-in effect and instrument panels have bypass, presets, Compare, Copy and Paste Settings and the side-chain pop-up; VST3 editor windows have no header."

[[feature]]
section = "Plug-in windows and settings"
name = "Load, save, step through and delete plug-in settings (presets)"
status = "partial"
tier = "pro"
logic = "571–572"
note = "Factory and user presets for the built-in effects and instruments (the Channel EQ among them), shared by every project; none for VST3s."

[[feature]]
section = "Plug-in windows and settings"
name = "Compare edits with the saved setting"
status = "done"
tier = "pro"
logic = "571"
issue = 80
note = "Built-in effects' and instruments' panels have Compare, Copy Settings and Paste Settings; VST3 plug-ins don't yet (#292)."

[[feature]]
section = "Plug-in windows and settings"
name = "Copy and paste plug-in settings; reset; default setting"
status = "partial"
tier = "pro"
logic = "572"
note = "Copy and paste for every plug-in (VST3 state included), Copy and Paste Settings between built-in panels, and Reset to Default for built-in plug-ins; no user default setting."

